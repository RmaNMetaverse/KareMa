# /etc/nginx/snippets/karema.conf
#
# Mounts KareMa under /KareMa/ on a server that already hosts something else.
# Include it from inside the existing "server { ... }" block:
#
#     include /etc/nginx/snippets/karema.conf;
#
# Nothing else in that file needs to change.

# "^~" matters: it stops nginx from handing /KareMa/assets/*.js or *.css to any
# regex location the other app may have defined for static files.
location ^~ /KareMa/ {
    # No trailing slash and no path here — the URI is passed through untouched,
    # because the container's own nginx is what knows about the /KareMa prefix.
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # live board updates travel over a websocket
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $karema_conn_upgrade;

    # attachments: allow big uploads and stream them straight through
    client_max_body_size 512M;
    proxy_request_buffering off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# http://<host>/KareMa (no slash) would otherwise fall through to the other app
location = /KareMa {
    return 301 /KareMa/;
}
