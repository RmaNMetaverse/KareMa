# /etc/nginx/conf.d/karema-upgrade-map.conf
#
# Websocket plumbing for KareMa's live board updates.
# This lives in nginx's http{} block, which /etc/nginx/conf.d/*.conf already is,
# so dropping the file in is all that is needed.
#
# The variable is deliberately named $karema_conn_upgrade rather than the usual
# $connection_upgrade: if the app already on this server defines that name,
# a second "map" for it would abort nginx with "duplicate map".

map $http_upgrade $karema_conn_upgrade {
    default upgrade;
    ''      close;
}
